name: Release

# Push a tag named after the version, such as v0.3.1, and this builds, signs and publishes it:
# - kolahal-X.Y.Z.apk and kolahal-X.Y.Z-lite.apk, signed with the release key, and the mapping zip,
#   on a GitHub release whose notes are docs/release/notes/X.Y.Z.md;
# - kolahal-X.Y.Z-play.aab, signed with the upload key, kept with this run for Play Console.
#
# Secrets (tools/make-keys.sh --secrets stores them): RELEASE_KEYSTORE_BASE64,
# RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD, and the same four for UPLOAD_.
# How it all fits together: docs/release/README.org.
# Variable, optional but recommended: RELEASE_CERT_SHA256, the release key's certificate digest;
# when set, both APKs must carry it, so a release can never go out under another key.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Check the tag, the version and the notes
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but app/build.gradle.kts says versionName $version."
            exit 1
          fi
          if [ ! -s "docs/release/notes/$version.md" ]; then
            echo "::error::docs/release/notes/$version.md is missing; it becomes the release notes."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Signing keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::The signing keys aren't set up; run tools/make-keys.sh --secrets."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/keys"
          printf %s "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
          printf %s "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/upload.jks"

      - name: Unit tests and signed builds
        env:
          KOLAHAL_RELEASE_STORE_FILE: ${{ runner.temp }}/keys/release.jks
          KOLAHAL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KOLAHAL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KOLAHAL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KOLAHAL_UPLOAD_STORE_FILE: ${{ runner.temp }}/keys/upload.jks
          KOLAHAL_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KOLAHAL_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KOLAHAL_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease :app:assembleLite :app:bundlePlay :app:assemblePlay

      - name: The lite and Play builds leave out what Play's policy rules out
        run: |
          tools/check-play-build.sh app/build/outputs/apk/lite/app-lite.apk
          tools/check-play-build.sh

      - name: Check the signatures
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          # shellcheck disable=SC2012  # build-tools versions are plain numbers
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          # keytool prints AB:CD…, apksigner abcd…: compare without colons, in lower case.
          expected=$(printf %s "$EXPECTED" | tr -d ':' | tr 'A-F' 'a-f')
          echo "### Signatures" >> "$GITHUB_STEP_SUMMARY"
          for apk in app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/lite/app-lite.apk; do
            digest=$("$apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
            if [ -z "$digest" ]; then echo "::error::$apk isn't signed."; exit 1; fi
            if [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
              echo "::error::$apk is signed with $digest, not the release key $expected."
              exit 1
            fi
            echo "- $(basename "$apk"): \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done
          bundle=$(keytool -printcert -jarfile app/build/outputs/bundle/play/app-play.aab)
          if ! printf %s "$bundle" | grep -q '^Owner:'; then echo "::error::The Play bundle isn't signed."; exit 1; fi
          if printf %s "$bundle" | grep -q 'CN=Android Debug'; then echo "::error::The Play bundle is debug-signed; Play refuses it."; exit 1; fi
          echo "- app-play.aab: $(printf %s "$bundle" | sed -n 's/^Owner: //p' | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/kolahal-$VERSION.apk"
          cp app/build/outputs/apk/lite/app-lite.apk "out/kolahal-$VERSION-lite.apk"
          cp app/build/outputs/bundle/play/app-play.aab "out/kolahal-$VERSION-play.aab"
          # R8's names for each build, to read crash traces with retrace.
          (cd app/build/outputs/mapping && zip -qr "$GITHUB_WORKSPACE/out/kolahal-$VERSION-mapping.zip" release lite play)
          cp "docs/release/notes/$VERSION.md" out/notes.md
          # shellcheck disable=SC2016  # the backticks are Markdown, not a command
          printf '\n\nBoth APKs are built from `%s`, the commit this tag points to.\n' "${GITHUB_SHA::7}" >> out/notes.md

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --latest \
            --title "Kolahal $VERSION" --notes-file out/notes.md \
            "out/kolahal-$VERSION.apk" "out/kolahal-$VERSION-lite.apk" "out/kolahal-$VERSION-mapping.zip"

      # For Play Console (Test and release → a track → Create new release → upload).
      - name: Keep the Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: kolahal-${{ env.VERSION }}-play
          path: |
            out/kolahal-${{ env.VERSION }}-play.aab
            app/build/outputs/mapping/play/mapping.txt
          retention-days: 90

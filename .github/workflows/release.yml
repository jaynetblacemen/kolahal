
name: Release

# Automatic release: push a vX.Y.Z tag.
# Manual release: run this workflow from Actions and enter vX.Y.Z.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v0.4.1)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      # Install the NDK version pinned by the project.
      - name: Install NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null || true
          test -d "$ANDROID_HOME/ndk/$ndk"

      - uses: gradle/actions/setup-gradle@v5

      # Validate the version and create the tag for manual releases.
      - name: Check version and prepare release tag
        env:
          PLAY_UPLOAD: ${{ vars.PLAY_WIF_PROVIDER }}
          MANUAL_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)

          if [ -z "$version" ]; then
            echo "::error::Could not read versionName from app/build.gradle.kts."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$MANUAL_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [ "$tag" != "v$version" ]; then
            echo "::error::Tag $tag does not match app version $version."
            exit 1
          fi

          if [ ! -s "docs/release/notes/$version.md" ]; then
            echo "::error::Missing docs/release/notes/$version.md."
            exit 1
          fi

          if [ -n "$PLAY_UPLOAD" ] && [ ! -s "docs/release/notes/$version-play.txt" ]; then
            echo "::error::Missing docs/release/notes/$version-play.txt."
            exit 1
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            current_commit=$(git rev-parse HEAD)

            remote_tag=$(git ls-remote --tags origin \
              "refs/tags/$tag" "refs/tags/$tag^{}")

            if [ -n "$remote_tag" ]; then
              git fetch origin "refs/tags/$tag:refs/tags/$tag"
              tag_commit=$(git rev-list -n 1 "$tag")

              if [ "$tag_commit" != "$current_commit" ]; then
                echo "::error::Tag $tag already exists on a different commit."
                exit 1
              fi

              echo "Tag $tag already exists on this commit; continuing."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git tag -a "$tag" -m "Kolahal $version"
              git push origin "refs/tags/$tag"
            fi
          fi

          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Check signing keys
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ] || [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::Signing keys are missing. Configure the repository secrets."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/keys"

          printf %s "$RELEASE_KEYSTORE_BASE64" |
            base64 -d > "$RUNNER_TEMP/keys/release.jks"

          printf %s "$UPLOAD_KEYSTORE_BASE64" |
            base64 -d > "$RUNNER_TEMP/keys/upload.jks"

      - name: Unit tests and signed builds
        env:
          KOLAHAL_RELEASE_STORE_FILE: ${{ runner.temp }}/keys/release.jks
          KOLAHAL_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KOLAHAL_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KOLAHAL_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KOLAHAL_UPLOAD_STORE_FILE: ${{ runner.temp }}/keys/upload.jks
          KOLAHAL_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          KOLAHAL_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          KOLAHAL_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            :app:testDebugUnitTest \
            :app:assembleRelease \
            :app:bundlePlay

          ./gradlew --no-daemon -PplayApk :app:assemblePlay

      - name: Check Play build policy
        run: tools/check-play-build.sh

      - name: Verify signatures
        env:
          EXPECTED: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail

          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/* |
            sort -V | tail -1)/apksigner

          expected=$(printf %s "$EXPECTED" |
            tr -d ':' | tr 'A-F' 'a-f')

          echo "### Signatures" >> "$GITHUB_STEP_SUMMARY"

          for apk in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/play/app-play.apk
          do
            certs=$("$apksigner" verify --print-certs "$apk")

            digest=$(printf %s "$certs" |
              sed -n 's/^.*[Ss]igner.* certificate SHA-256 digest: //p' |
              head -1)

            if [ -z "$digest" ]; then
              echo "$certs"
              echo "::error::$apk isn't signed."
              exit 1
            fi

            if printf %s "$certs" | grep -q 'CN=Android Debug'; then
              echo "::error::$apk is debug-signed."
              exit 1
            fi

            if [ -n "$expected" ] && [ "$digest" != "$expected" ]; then
              echo "::error::$apk has the wrong signing certificate."
              exit 1
            fi

            echo "- $(basename "$apk"): \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
          done

          bundle=$(keytool -printcert -jarfile \
            app/build/outputs/bundle/play/app-play.aab)

          if ! printf %s "$bundle" | grep -q '^Owner:'; then
            echo "::error::The Play bundle isn't signed."
            exit 1
          fi

          if printf %s "$bundle" | grep -q 'CN=Android Debug'; then
            echo "::error::The Play bundle is debug-signed."
            exit 1
          fi

          echo "- app-play.aab: $(printf %s "$bundle" |
            sed -n 's/^Owner: //p' | head -1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Package release
        run: |
          mkdir -p out

          cp app/build/outputs/apk/release/app-release.apk \
            "out/kolahal-$VERSION.apk"

          cp app/build/outputs/apk/play/app-play.apk \
            "out/kolahal-$VERSION-play.apk"

          cp app/build/outputs/bundle/play/app-play.aab \
            "out/kolahal-$VERSION-play.aab"

          (
            cd app/build/outputs/mapping
            zip -qr "$GITHUB_WORKSPACE/out/kolahal-$VERSION-mapping.zip" release play
          )

          cp "docs/release/notes/$VERSION.md" out/notes.md

          printf '\n\nBoth APKs and the Play bundle are built from `%s`, the commit this tag points to.\n' \
            "${GITHUB_SHA::7}" >> out/notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest \
            --title "Kolahal $VERSION" \
            --notes-file out/notes.md \
            "out/kolahal-$VERSION.apk" \
            "out/kolahal-$VERSION-play.apk" \
            "out/kolahal-$VERSION-mapping.zip"

      - name: Keep Play bundle
        uses: actions/upload-artifact@v7
        with:
          name: kolahal-${{ env.VERSION }}-play
          path: |
            out/kolahal-${{ env.VERSION }}-play.aab
            app/build/outputs/mapping/play/mapping.txt
          retention-days: 90

      - name: Upload to Google Play
        if: vars.PLAY_WIF_PROVIDER != '' && vars.PLAY_SERVICE_ACCOUNT != ''
        env:
          PLAY_WIF_PROVIDER: ${{ vars.PLAY_WIF_PROVIDER }}
          PLAY_SERVICE_ACCOUNT: ${{ vars.PLAY_SERVICE_ACCOUNT }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK }}
          PLAY_SEND_FOR_REVIEW: ${{ vars.PLAY_SEND_FOR_REVIEW }}
        run: |
          tools/play-upload.sh \
            "out/kolahal-$VERSION-play.aab" \
            "docs/release/notes/$VERSION-play.txt" \
            "$VERSION"

name: Play Build

on:
workflow_dispatch:

permissions:
contents: read

concurrency:
group: play-build-${{ github.ref }}
cancel-in-progress: true

jobs:
build-play:
name: Build and verify Play APK
runs-on: ubuntu-latest
timeout-minutes: 30

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'
      cache: gradle

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Grant Gradle permission
    run: chmod +x gradlew

  - name: Build Play variant
    run: ./gradlew :app:assemblePlay --stacktrace

  - name: Verify Play APK
    run: bash tools/check-play-build.sh

  - name: Upload Play APK
    uses: actions/upload-artifact@v4
    with:
      name: kolahal-play-apk
      path: app/build/outputs/apk/play/*.apk
      if-no-files-found: error
      retention-days: 14

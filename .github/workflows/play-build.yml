name: Play Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: play-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-play:
    name: Build and verify Play APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Build Play variant
        run: ./gradlew :app:assemblePlay --stacktrace

      - name: Verify Play APK
        run: bash tools/check-play-build.sh
        
      - name: Generate temporary test keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/test.keystore" \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Sign Play APK for testing
        run: |
          APK="app/build/outputs/apk/play/app-play-unsigned.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/test.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK"

          "$APKSIGNER" verify --verbose "$APK"
          mv "$APK" app/build/outputs/apk/play/kolahal-play-test.apk

      - name: Upload Play APK
        uses: actions/upload-artifact@v4
        with:
          name: kolahal-play-apk
          path: app/build/outputs/apk/play/*.apk
          if-no-files-found: error
          retention-days: 14

<!doctype html>
<!-- The Play Store feature graphic, 1024 × 500: the icon, the name and a line on the left, the top
     of the home screen (raw/1-home.png) in a phone on the right. tools/play-graphics.sh renders it. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kolahal feature graphic</title>
<style>
	@font-face { font-family: 'JetBrains Mono'; font-weight: 400; src: url('../../../app/src/main/res/font/jetbrains_mono_regular.ttf'); }
	@font-face { font-family: 'JetBrains Mono'; font-weight: 700; src: url('../../../app/src/main/res/font/jetbrains_mono_bold.ttf'); }
	:root {
		/* As screenshot.html: gruvbox dark, with an orange and an aqua glow. */
		--fg: #ebdbb2;
		--dim: #bdae93;
		--accent: #fabd2f;
		--screen: #282828;
		--bezel: #3c3836;
		--edge: #665c54;
	}
	* { margin: 0; box-sizing: border-box; }
	html, body { width: 1024px; height: 500px; overflow: hidden; }
	body {
		font-family: 'JetBrains Mono', monospace;
		color: var(--fg);
		background:
			radial-gradient(ellipse 55% 80% at 8% 10%, rgb(254 128 25 / 0.30), transparent 70%),
			radial-gradient(ellipse 45% 85% at 80% 85%, rgb(142 192 124 / 0.26), transparent 70%),
			radial-gradient(rgb(235 219 178 / 0.06) 1.4px, transparent 1.6px) 0 0 / 24px 24px,
			linear-gradient(160deg, #32302f, #1d2021 55%, #141617);
		position: relative;
	}
	.text {
		position: absolute;
		left: 76px;
		top: 50%;
		transform: translateY(-50%);
	}
	.text img {
		display: block;
		width: 104px;
		height: 104px;
		border-radius: 26px;
		box-shadow: inset 0 0 0 1px var(--edge), 0 0 0 1px #504945, 0 14px 30px -10px rgb(0 0 0 / 0.8);
	}
	h1 {
		margin-top: 30px;
		font-size: 84px;
		font-weight: 700;
		line-height: 1;
		letter-spacing: -0.02em;
	}
	p {
		margin-top: 20px;
		font-size: 27px;
		line-height: 1.4;
		color: var(--dim);
	}
	p span { color: var(--fg); }
	p em { font-style: normal; color: var(--accent); }
	.phone {
		position: absolute;
		left: 640px;
		top: 52px;
		width: 318px;
		height: 640px;
		padding: 10px;
		border-radius: 42px;
		background: linear-gradient(160deg, #504945, var(--bezel) 30%, #282828);
		box-shadow: inset 0 0 0 2px var(--edge), 0 30px 70px -20px rgb(0 0 0 / 0.8), 0 0 90px -10px rgb(142 192 124 / 0.3);
	}
	.screen {
		position: relative;
		width: 298px;
		height: 620px;
		border-radius: 32px;
		overflow: hidden;
		background: var(--screen);
	}
	/* The capture is 1080 × 2400; its top part, at 298 px wide. */
	.screen img { display: block; width: 298px; }
	.screen::after {
		content: '';
		position: absolute;
		top: 11px;
		left: 50%;
		width: 12px;
		height: 12px;
		margin-left: -6px;
		border-radius: 50%;
		background: #0e0f0f;
		box-shadow: inset 0 0 0 2px #1d2021;
	}
</style>
</head>
<body>
	<div class="text">
		<img src="icon.svg" alt="">
		<h1>Kolahal</h1>
		<p><span>Your home screen, as a terminal.</span><br><em>$</em> type a few letters, press Enter</p>
	</div>
	<div class="phone"><div class="screen"><img src="raw/1-home.png" alt=""></div></div>
</body>
</html>
